# Plain words for each branch of the Tree (Claude, 15 Nov 2026). What a branch IS stays here; its status, history and next step are read
# from research/TREE.md and the drops at every build (research/tree/brain_build.py), never written by hand. `lesson` is filled when the
# textbook unit that explains the branch exists. Plain names first; the id is shown small beside them.
goal:
  title: Find a planet around two suns
  plain: The whole project in one line. We search NASA's TESS light for a planet that circles two stars at once. Finding one is a win, and so is proving, with measured numbers, that none was there to find.
branches:
  "1":
    title: How well we see
    plain: Our search tool, Petrova. Every branch here is a way a real planet could slip past it, ordered by how many test planets each one loses.
  "1.1":
    title: Found, but held back
    plain: The tool finds the dip but a safety flag keeps it from the top tier. The biggest fixable loss on our test bench.
  "1.2":
    title: Outside the searched windows
    plain: The planet's dip falls in a stretch of data the search never looks at, so it cannot be found at all.
  "1.3":
    title: The dip is missed
    plain: The detector itself does not see the dip, usually because it is too shallow for the noise around it.
  "1.4":
    title: The eclipse mask hides the transit
    plain: We blank out the binary's own eclipses before searching. If those blanks are too wide or in the wrong place, they swallow the planet too.
  "1.5":
    title: Blind spot for fast binaries
    plain: Binaries that orbit each other in 5 to 10 days are noisier, and the tool finds very few test planets around them.
  "1.6":
    title: False alarms
    plain: The other side of every fix. A change that finds more planets but also more fake ones is no gain. The upside-down test light counts the fake ones.
  "1.7":
    title: The scoreboard
    plain: The fixed test of 2,000 planted planets that decides whether any change to the tool counts.
  "2":
    title: Where we look
    plain: Which stars we search, and the data we search them in.
  "2.1":
    title: Census, our own binary list
    plain: A list of eclipsing binaries we build ourselves from newer TESS data, so our searches reach stars nobody has searched this way.
  "2.2":
    title: G1, the last untouched list
    plain: 552 Kepler binaries that TESS also watched. Searched only once, sealed, after the tool is fixed and frozen.
  "2.3":
    title: Data and downloads
    plain: Getting the light files from NASA's archive and keeping them complete and correct.
  "2.4":
    title: Ideas on hold
    plain: Bigger systems we designed but parked until the main search is done.
  "3":
    title: How we prove it
    plain: The rules and statistics that keep us honest, so a result means what it says.
  "3.1":
    title: Statistics and controls
    plain: How we decide that a signal is more than chance, using the upside-down light as a fair comparison.
  "3.2":
    title: Records and tests
    plain: Every run leaves a record that lets anyone repeat it, and every tool has tests that can fail.
  "3.3":
    title: From a dip to a claim
    plain: The steps a promising dip must pass, with two independent checks and your yes, before we ever call it a planet.
  "3.4":
    title: Going public later
    plain: How and when a result would be shared with astronomers, once there is something to share.
  "4":
    title: Tools and book
    plain: The book, the textbook, and the pages and tools around the search.
  "4.1":
    title: Book and learning
    plain: This book and its textbook, built so you can follow and check everything we do.
  "4.2":
    title: Search window and control room
    plain: The live page that shows a search while it runs.
  "4.3":
    title: Machine and housekeeping
    plain: The computer, the scripts and the small repairs that keep the work running.
  "4.4":
    title: Eyes pages
    plain: The practice pages where you learn to tell real dips from fake ones.
