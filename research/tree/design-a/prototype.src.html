<title>The Tree, Design A</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: mockup A ("a real tree"). A thin golden vine grows up the middle from its roots to the goal; the four branch
   cards hang off it on both sides; the chosen branch opens in a panel on the right (PC) or a bottom sheet (phone). */
:root {
  --bg: #0b111e; --card: #111a2b; --card-hi: #172238; --line: #263149; --line-soft: #1d2740;
  --text: #eef1f7; --text-2: #c3cbdb; --text-3: #95a1b8;
  --gold: #e9b95d; --gold-2: #c8963f; --gold-dim: #8c6a30; --bar: #2a3550;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f6f7fa; --card: #ffffff; --card-hi: #f1f4f9; --line: #d3d9e5; --line-soft: #e3e7ef;
  --text: #0e1422; --text-2: #303a4f; --text-3: #525d74;
  --gold: #a5741c; --gold-2: #8d6114; --gold-dim: #b8955a; --bar: #e1e6ef; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f6f7fa; --card: #ffffff; --card-hi: #f1f4f9; --line: #d3d9e5; --line-soft: #e3e7ef;
  --text: #0e1422; --text-2: #303a4f; --text-3: #525d74;
  --gold: #a5741c; --gold-2: #8d6114; --gold-dim: #b8955a; --bar: #e1e6ef; color-scheme: light; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 400 16px/1.5 var(--sans); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.page { padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.switch { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.switch span { color: var(--text-3); font-size: 14px; margin-right: 6px; }
.switch button { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; font-size: 14px; }
.switch button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
[hidden] { display: none !important; }

/* ---------- shared pieces ---------- */
.mono { font-family: var(--mono); letter-spacing: .02em; }
.st { font: 500 14px var(--mono); letter-spacing: .06em; color: var(--text-3); text-transform: uppercase; white-space: nowrap; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.eyebrow { font: 600 14px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
.chev { color: var(--text-3); font-size: 18px; line-height: 1; }
.goal { padding: 18px 22px; display: grid; gap: 6px; position: relative; }
.goal h2 { margin: 0; font: 700 clamp(19px, 2.1vw, 24px)/1.3 var(--sans); text-wrap: balance; }
.goal .chev { position: absolute; right: 18px; top: 18px; }
.score { padding: 18px 22px; display: grid; gap: 10px; position: relative; }
.score p { margin: 0; color: var(--text-2); font-size: 17px; }
.score .chev { position: absolute; right: 18px; top: 18px; }
.meter { position: relative; height: 6px; border-radius: 6px; background: var(--bar); }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--gold); }
.meter b { position: absolute; top: -5px; height: 16px; border: 1.5px solid var(--gold); border-radius: 4px; }
.meter u { position: absolute; top: -6px; width: 2px; height: 18px; background: var(--text); }
.score .foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 15px; color: var(--text-3); }
.score .foot strong { color: var(--text); font-weight: 600; }
.score .foot strong::before { content: "\25CF"; color: var(--gold); font-size: 10px; margin-right: 6px; vertical-align: 2px; }
.chips { display: flex; align-items: center; gap: 0; }
.chip { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 64px; cursor: pointer; text-align: left; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1.5px solid var(--text); }
.chip .dot.on { background: var(--text); }
.chip b { display: block; font-weight: 600; font-size: 16px; }
.chip .st { color: var(--text-2); }
.chips .dash { width: 18px; border-top: 1.5px dashed var(--text-3); flex: none; }

/* a branch card: the header, then its rows on a thin guide line */
.br { position: relative; z-index: 2; }
.br-h { display: grid; grid-template-columns: 22px 1fr auto auto; gap: 8px 10px; align-items: start; padding: 14px 16px 12px; cursor: pointer; width: 100%; text-align: left; background: none; border: 0; }
.br-h .n { color: var(--gold); font: 500 17px var(--mono); padding-top: 2px; }
.br-h h3 { margin: 0; font: 700 20px/1.25 var(--sans); }
.br-h p { margin: 2px 0 0; color: var(--text-3); font-size: 15px; }
.br-h .tog { color: var(--text-3); font-size: 20px; line-height: 1; padding-top: 2px; width: 14px; text-align: center; }
.rows { margin: 0 12px 12px 34px; padding: 0 0 0 10px; border-left: 1.5px solid var(--line); list-style: none; }
.rows li { position: relative; }
.rows li::before { content: ""; position: absolute; left: -10px; top: 50%; width: 9px; border-top: 1.5px dashed var(--line); }
.row { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto 14px; gap: 6px 8px; align-items: center; text-align: left; background: none; border: 1px solid transparent; border-bottom-color: var(--line-soft); border-radius: 6px; padding: 10px 8px; min-height: 56px; cursor: pointer; }
.rows li:last-child .row { border-bottom-color: transparent; }
.row:hover { background: var(--card-hi); }
.row[aria-current="true"] { background: var(--card-hi); border-color: var(--line); }
.row .id { font: 400 15px var(--mono); color: var(--text-3); }
.row .t { font-size: 17px; line-height: 1.3; }
.row .t small { display: block; color: var(--text-3); font-size: 15px; }
.row .loss { font: 500 16px var(--mono); color: var(--text-2); }

/* the detail panel / sheet */
.detail { padding: 24px; display: grid; gap: 14px; align-content: start; position: relative; }
.detail .crumb { font: 500 15px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); margin: 0; }
.detail h2 { margin: 0; font: 700 clamp(26px, 2.6vw, 34px)/1.15 var(--sans); text-wrap: balance; }
.detail .x { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border: 0; background: none; color: var(--text-2); font-size: 26px; cursor: pointer; border-radius: 8px; }
.pill { display: inline-flex; gap: 12px; align-items: center; color: var(--text-2); }
.pill .st { color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; }
.detail h4 { margin: 0 0 2px; font: 700 16px var(--sans); }
.detail p { margin: 0; color: var(--text-2); font-size: 17px; }
.metric { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.metric .big { font: 500 22px var(--mono); color: var(--text); }
.metric .big span { font: 400 15px var(--sans); color: var(--text-2); margin-left: 8px; }
.work { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.work a, .work button { display: grid; grid-template-columns: auto minmax(0, 1fr) 14px; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--bg); color: var(--text); text-decoration: none; cursor: pointer; min-height: 48px; font-size: 16px; }
.work a > span:nth-child(2), .work button > span:nth-child(2) { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.work .tag { font: 500 15px var(--mono); color: var(--gold); white-space: nowrap; }
.links { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.links a { color: var(--gold); font-weight: 500; font-size: 17px; text-decoration: underline; text-underline-offset: 5px; }

/* ---------- PC: mockup A proportions (main area: left 34, vine 32, right 34; detail 360 px beside it) ---------- */
.pcwrap { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 12px; }
.pc { position: relative; min-width: 1180px; max-width: 1480px; padding: 30px 32px 56px; background: var(--bg); }
.pc > .vine { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; overflow: visible; }
.pc-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px; }
.pc-top h1 { margin: 0; font: 700 46px/1 var(--sans); letter-spacing: -.01em; }
.pc-top nav { display: flex; gap: 32px; }
.pc-top nav a { color: var(--text-2); text-decoration: none; font-size: 17px; }
.pc-cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; column-gap: 26px; }
.pc-head { display: grid; grid-template-columns: 22fr 46fr 1.5fr 30.5fr; margin-bottom: 16px; position: relative; z-index: 2; }
.pc-head .goal { grid-column: 2; } .pc-head .score { grid-column: 4; }
.pc .goal h2 { font-size: 21px; } .pc .score p { font-size: 16px; }
.pc .chips { margin-bottom: 40px; position: relative; z-index: 2; }
.pc .chip { min-height: 56px; }
.pc-tree { display: grid; grid-template-columns: 34fr 32fr 34fr; position: relative; z-index: 2; padding-bottom: 150px; }
.pc-tree .colL { grid-column: 1; } .pc-tree .colR { grid-column: 3; }
.colL, .colR { display: grid; gap: 50px; align-content: start; }
.br-h { padding: 12px 14px 10px; grid-template-columns: 18px minmax(0, 1fr) auto auto; align-items: center; }
.br-h .n { font-size: 16px; align-self: start; padding-top: 3px; }
.br-h h3 { font-size: 19px; } .br-h p { font-size: 14px; }
.rows { margin: 0 10px 10px 26px; }
.row { grid-template-columns: 28px minmax(0, 1fr) auto auto 12px; gap: 4px 8px; padding: 9px 6px; min-height: 52px; }
.row .id { font-size: 14px; } .row .t { font-size: 15.5px; } .row .t small { font-size: 13.5px; } .row .loss { font-size: 15px; } .row .st { font-size: 13px; }
.pc-detail { align-self: start; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; overscroll-behavior: contain; margin-top: 92px; z-index: 3; }
.pc-detail .detail { padding: 22px 22px 24px; }
.pc-detail .detail h2 { font-size: 28px; padding-right: 36px; }
.pc-detail .detail p { font-size: 15.5px; }
.pc-detail:empty { display: none; }
/* ---------- phone ---------- */
.phonewrap { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
.phone { width: 390px; max-width: 100%; height: 844px; border: 1px solid var(--line); border-radius: 34px; overflow: hidden; position: relative; background: var(--bg); flex: none; }
.phone .sc { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.phone .hd { position: sticky; top: 0; z-index: 6; height: 54px; display: flex; align-items: center; gap: 22px; padding: 0 18px; background: var(--card); border-bottom: 1px solid var(--line); font: 600 15px var(--sans); letter-spacing: .26em; }
.phone .hd i { width: 18px; height: 2px; background: var(--text); box-shadow: 0 6px 0 var(--text), 0 -6px 0 var(--text); margin-right: 4px; }
.phone .hd svg { margin-left: auto; } .phone .hd svg + svg { margin-left: 0; }
.ph { padding: 18px 16px 40px; display: grid; gap: 10px; }
.ph h1 { margin: 6px 0 6px; font: 700 32px/1 var(--sans); }
.ph .goal { padding: 14px; } .ph .goal h2 { font-size: 20px; padding-right: 10px; }
.ph .score { padding: 14px; } .ph .score p { font-size: 16px; }
.ph .chips { display: grid; grid-template-columns: 1.2fr 12px 1fr; }
.ph .chip { min-height: 52px; padding: 8px 10px; gap: 9px; min-width: 0; }
.ph .chip b { font-size: 14.5px; white-space: nowrap; }
.ph .chips .dash { width: 12px; }
.phtree { position: relative; margin-top: 2px; }
.phtree .vine { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; overflow: visible; }
.phcard { position: absolute; z-index: 2; width: calc(50% - 18px); padding: 10px 12px 11px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.phcard.l { left: 0; } .phcard.r { right: 0; }
.phcard h3 { margin: 0; font: 700 15px/1.25 var(--sans); padding-right: 18px; }
.phcard .tog { position: absolute; right: 10px; top: 10px; color: var(--text-3); font-size: 18px; line-height: 1; }
.phcard .st { font-size: 13px; }
.phcard p { margin: 2px 0 0; color: var(--text-3); font-size: 14px; }
.phrows { margin-top: 4px; }
.phrows .br-h { padding: 14px 14px 6px; grid-template-columns: minmax(0, 1fr) auto; }
.phrows .rows { margin-left: 14px; }
.phrows .row .t { font-size: 15px; }
.scrim { position: absolute; inset: 0; background: rgba(3, 6, 14, .5); z-index: 8; animation: f .2s; }
@keyframes f { from { opacity: 0; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; max-height: 76%; overflow-y: auto; overscroll-behavior: contain; background: var(--card); border: 1px solid var(--line); border-radius: 18px 18px 0 0; animation: u .26s cubic-bezier(.2, .8, .2, 1); }
@keyframes u { from { transform: translateY(100%); } }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 10px auto 0; }
.sheet .detail { padding: 12px 18px 26px; }
.sheet .detail h2 { font-size: 27px; padding-right: 40px; }
.sheet .detail p { font-size: 16px; }
.notes { display: grid; gap: 10px; max-width: 380px; align-content: start; }
.note { padding: 14px 16px; }
.note b { display: block; margin-bottom: 4px; }
.note span { color: var(--text-2); font-size: 15px; }
@media (prefers-reduced-motion: reduce) { .scrim, .sheet { animation: none; } .vine path.grow { animation: none !important; } }
.vine path.grow { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.4s cubic-bezier(.3, .7, .2, 1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
</style>

<div class="page">
  <div class="switch" role="group" aria-label="Show"><span>Design A, live with today's data:</span>
    <button type="button" id="b-pc" data-v="pc" aria-pressed="true">PC</button>
    <button type="button" id="b-phone" data-v="phone" aria-pressed="false">Phone</button>
  </div>

  <section id="v-pc">
    <div class="pcwrap"><div class="pc" id="pc"></div></div>
  </section>
  <section id="v-phone" hidden>
    <div class="phonewrap">
      <div class="phone"><div class="sc" id="phsc"></div></div>
      <div class="notes">
        <div class="note box"><b>Tap a branch card</b><span>Its rows open in the list under the tree. Tap a row for the full card as a sheet from the bottom.</span></div>
        <div class="note box"><b>The sheet holds the page still</b><span>While it is open the page behind does not scroll; close it with the cross, a tap outside, or Back.</span></div>
      </div>
    </div>
  </section>
</div>

<script type="application/json" id="tree-data">/*__TREE_DATA__*/</script>
<script>
(() => {
  "use strict";
  const D = JSON.parse(document.getElementById("tree-data").textContent);
  const nodes = {}; D.nodes.forEach((n) => (nodes[n.id] = n));
  const leaves = {}; D.leaves.forEach((l) => (leaves[l.id] = l));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const NS = "http://www.w3.org/2000/svg";
  const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const WORD = { ACTIVE: "Active", NEXT: "Next", WAITS: "Waits", PARKED: "Parked", BLOCKED: "Blocked", DONE: "Done" };
  // what the mockup shows that the data file does not carry yet (in the real build these come from TREE.md)
  const SUB = { "1": "Petrova · 222 test planets", "2": "Which stars, which data", "3": "Statistics and evidence", "4": "The notebook and workshop" };
  const LOSS = { "1.1": 53, "1.2": 52, "1.3": 41, "1.4": 15 };
  const CRUMB = { "1": "Petrova", "2": "Where we look", "3": "How we prove it", "4": "Tools and book" };
  const LEFT = ["1", "4"], RIGHT = ["2", "3"];
  let sel = "1.1", open = { "1": true, "2": true, "3": true, "4": true };

  /* ---------- pieces ---------- */
  const goalHTML = () => `<div class="goal box"><span class="eyebrow">Goal</span><span class="chev" aria-hidden="true">&#8250;</span><h2>Find a circumbinary planet in TESS data, or prove a clean, measured null.</h2><div><span class="st">Waits</span> <span style="color:var(--text-2)">&nbsp;Petrova checks</span></div></div>`;
  const scoreHTML = () => `<div class="score box"><span class="eyebrow">Petrova scoreboard</span><span class="chev" aria-hidden="true">&#8250;</span><p>Petrova catches 27% of Saturn-like test planets.</p>
    <div class="meter" role="img" aria-label="27 percent, likely range 21 to 34 percent"><i style="width:27%"></i><b style="left:21%;width:13%"></b><u style="left:27%"></u></div>
    <div class="foot"><span class="mono">Range 21 to 34%</span><strong>Fix first</strong></div></div>`;
  const chipsHTML = () => `<div class="chips"><button type="button" class="chip box"><span class="dot on"></span><span><b>Fixing the book</b><span class="st">Active</span></span><span class="chev">&#8250;</span></button><span class="dash"></span><button type="button" class="chip box" data-node="1.1"><span class="dot"></span><span><b>1.1 Flags</b><span class="st">Next</span></span><span class="chev">&#8250;</span></button></div>`;
  const rowHTML = (c, compact) => { const n = nodes[c]; if (!n) return ""; const sub = n.id === "2.2" ? `<small>The last unseen list, one shot</small>` : n.id === "2.1" ? `<small>Our own binary star list</small>` : n.id === "3.3" ? `<small>How a dip becomes a claim</small>` : ""; return `<li><button type="button" class="row" data-node="${c}" aria-current="${c === sel}"><span class="id">${esc(c)}</span><span class="t">${esc(n.title)}${sub}</span><span class="loss">${LOSS[c] || ""}</span><span class="st">${esc(WORD[n.status] || "")}</span><span class="chev" aria-hidden="true">${c === sel ? '<span style="display:inline-block;transform:rotate(90deg)">&#8250;</span>' : "&#8250;"}</span></button></li>`; };
  const branchHTML = (id) => { const b = nodes[id]; return `<div class="br box" data-branch="${id}"><button type="button" class="br-h" data-toggle="${id}" aria-expanded="${!!open[id]}"><span class="n">${id}</span><span><h3>${esc(b.title)}</h3><p>${esc(SUB[id] || "")}</p></span><span class="st">${esc(WORD[b.status] || "")}</span><span class="tog" aria-hidden="true">${open[id] ? "&minus;" : "+"}</span></button>${open[id] ? `<ul class="rows">${b.children.map((c) => rowHTML(c)).join("")}</ul>` : ""}</div>`; };
  const fmt = (iso) => { if (!iso) return ""; const d = new Date(iso.length > 10 ? iso : iso + "T12:00"); return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }); };
  function detailHTML(id, closable) {
    const n = nodes[id]; if (!n) return "";
    const branch = id.split(".")[0], loss = LOSS[id];
    const st = n.status_text || "", note = (st.match(/\(([^)]+)\)/) || [])[1] || "", why = st && !st.toUpperCase().startsWith(n.status) ? st : "";
    const work = (n.history || []).slice(0, 3).map((lid) => { const l = leaves[lid]; if (!l) return ""; const fx = lid.match(/fix-?(\d+)/i), tag = fx ? "FIX " + fx[1] : fmt(l.date || l.when), first = String(l.plain).split(/(?<=[.;:])\s/)[0].replace(/[.;:]$/, ""); return `<button type="button" data-leaf="${esc(lid)}"><span class="tag">${esc(tag)}</span><span>${esc(first)}</span><span class="chev">&#8250;</span></button>`; }).join("");
    return `<div class="detail">${closable ? `<button type="button" class="x" aria-label="Close">&times;</button>` : ""}<p class="crumb">${esc(CRUMB[branch] || "")} / ${esc(id)}</p><h2>${esc(n.title)}</h2>
      <div class="pill"><span class="st">${esc(WORD[n.status] || "")}</span>${esc(note ? note[0].toUpperCase() + note.slice(1) : "")}</div>
      <div><h4>What it is</h4><p>${esc(n.plain)}</p></div>
      ${why ? `<div><h4>Why it matters</h4><p>${esc(why)}</p></div>` : ""}
      ${loss ? `<div class="metric"><div class="big">${loss} of 222<span>test planets held back</span></div><div class="meter"><i style="width:${(loss / 222 * 100).toFixed(1)}%"></i></div></div>` : ""}
      ${work ? `<div class="work"><span class="eyebrow">Work under this node</span>${work}</div>` : ""}
      <div class="links"><a href="#read">Read more &rarr;</a>${n.lesson || id.startsWith("1") ? `<a href="#learn">Learn this &rarr;</a>` : ""}</div></div>`;
  }

  /* ---------- the vine (drawn from where the cards really are) ---------- */
  const leafAt = (g, x, y, ang, s) => el("path", { d: `M0,0 C${s * .3},${-s * .42} ${s * .78},${-s * .38} ${s},0 C${s * .78},${s * .38} ${s * .3},${s * .42} 0,0Z M1,0 L${s * .85},0`, transform: `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${ang})`, fill: "none", stroke: "var(--gold-2)", "stroke-width": 1.3, "stroke-linejoin": "round" }, g);
  // trunk from top to bottom, a branch to each card, a leaf on each branch, twigs, roots at the base
  function drawVine(svg, o) {
    const { cx, top, bottom, targets, k, twigs } = o;
    svg.innerHTML = "";
    const g = el("g", {}, svg);
    const H = bottom - top;
    const sway = (y) => cx + Math.sin(((y - top) / H) * Math.PI * 1.6) * 16 * k - Math.sin(((y - top) / H) * Math.PI * 4.2) * 4 * k;
    let d = `M${sway(top).toFixed(1)},${top}`;
    for (let y = top + 6; y <= bottom; y += 6) d += ` L${sway(y).toFixed(1)},${y}`;
    el("path", { d, fill: "none", stroke: "var(--gold)", "stroke-width": 2 * k, "stroke-linecap": "round", class: "grow" }, g);
    targets.forEach((t, i) => {
      const y0 = t.join, x0 = sway(y0), side = Math.sign(t.x - x0) || 1, dx = t.x - x0;
      const c1x = x0 + dx * .18, c1y = y0 - (y0 - t.y) * .55, c2x = x0 + dx * .55, c2y = t.y + 2;
      const p = el("path", { d: `M${x0.toFixed(1)},${y0} C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${t.x.toFixed(1)},${t.y}`, fill: "none", stroke: "var(--gold)", "stroke-width": 1.4 * k, class: "grow" }, g);
      p.style.animationDelay = 250 + i * 150 + "ms";
      const lx = x0 + dx * .3, ly = y0 - (y0 - t.y) * .62 - 4 * k;
      leafAt(g, lx, ly, side > 0 ? -38 : 218, 22 * k);
      el("circle", { cx: x0.toFixed(1), cy: y0, r: 3.6 * k, fill: "var(--bg)", stroke: "var(--gold)", "stroke-width": 1.3 }, g);
    });
    (twigs || []).forEach(([fy, side, len]) => {
      const y = top + H * fy, x = sway(y), ex = x + side * len * k, ey = y - 18 * k;
      el("path", { d: `M${x.toFixed(1)},${y.toFixed(1)} C${(x + side * len * .3 * k).toFixed(1)},${(y + 6 * k).toFixed(1)} ${(x + side * len * .7 * k).toFixed(1)},${(ey - 4).toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`, fill: "none", stroke: "var(--gold-2)", "stroke-width": 1.1 * k }, g);
      leafAt(g, ex, ey, side > 0 ? -24 : 204, 26 * k);
    });
    const rx = sway(bottom);
    [[-150, 40, .7], [-110, 70, .55], [-45, 82, .6], [25, 86, .6], [80, 66, .55], [140, 38, .7]].forEach(([dx, dy, o2]) =>
      el("path", { d: `M${rx.toFixed(1)},${bottom - 34 * k} C${(rx + dx * .15 * k).toFixed(1)},${bottom + dy * .25 * k} ${(rx + dx * .6 * k).toFixed(1)},${bottom + dy * .75 * k} ${(rx + dx * k).toFixed(1)},${bottom + dy * k}`, fill: "none", stroke: "var(--gold-dim)", "stroke-width": 1.1, opacity: o2 }, g));
    el("path", { d: `M${rx.toFixed(1)},${bottom - 4} L${(rx - 2).toFixed(1)},${bottom + 52 * k}`, stroke: "var(--gold)", "stroke-width": 2 * k, fill: "none", "stroke-linecap": "round" }, g);
    svg.querySelectorAll("path.grow").forEach((q) => { try { q.style.setProperty("--len", Math.ceil(q.getTotalLength())); } catch (e) {} });
  }

  /* ---------- PC ---------- */
  const pc = document.getElementById("pc");
  const leafHTML = (lf) => `<div class="detail"><button type="button" class="x" aria-label="Close">&times;</button><p class="crumb">${esc(lf.node)} / ${esc(fmt(lf.date))}</p><h2 style="font-size:22px;line-height:1.3">${esc(lf.plain)}</h2>${lf.why ? `<div><h4>Why it matters</h4><p>${esc(lf.why)}</p></div>` : ""}<div class="links"><a href="#" data-node="${esc(lf.node)}">Back to ${esc(lf.node)} &rarr;</a></div></div>`;
  function renderPC() {
    pc.innerHTML = `<svg class="vine" id="pc-vine" aria-hidden="true"></svg>
      <div class="pc-top"><h1>The Tree</h1><nav><a href="#notes">Field notes &#8250;</a><a href="#window">Search window &#8250;</a></nav></div>
      <div class="pc-cols"><div>
          <div class="pc-head">${goalHTML()}${scoreHTML()}</div>
          ${chipsHTML()}
          <div class="pc-tree" id="pc-tree"><div class="colL">${LEFT.map(branchHTML).join("")}</div><div class="colR">${RIGHT.map(branchHTML).join("")}</div></div>
        </div>
        <aside class="pc-detail box" id="pc-detail">${sel ? detailHTML(sel, true) : ""}</aside></div>`;
    if (!sel) pc.querySelector("#pc-detail").replaceChildren();
    requestAnimationFrame(drawPCVine);
  }
  function drawPCVine() {
    const svg = pc.querySelector("#pc-vine"), tree = pc.querySelector("#pc-tree"); if (!svg || !tree) return;
    const o = pc.getBoundingClientRect(), goal = pc.querySelector(".pc-head .goal").getBoundingClientRect();
    const rel = (r) => ({ l: r.left - o.left, r: r.right - o.left, t: r.top - o.top, b: r.bottom - o.top });
    svg.setAttribute("width", o.width); svg.setAttribute("height", o.height); svg.style.width = o.width + "px"; svg.style.height = o.height + "px";
    const T = rel(tree.getBoundingClientRect()), cx = T.l + (T.r - T.l) * .5;
    const brs = [...tree.querySelectorAll(".br")], cards = brs.map((b) => rel(b.getBoundingClientRect()));
    const lowest = Math.max(...cards.map((c) => c.b));
    const targets = brs.map((b, i) => { const c = cards[i], y = c.t + 34; return { x: b.closest(".colL") ? c.r : c.l, y, join: y + 58 }; });
    drawVine(svg, { cx, top: rel(goal).b, bottom: lowest + 60, targets, k: 1, twigs: [[.33, -1, 54], [.5, 1, 50], [.72, -1, 48]] });
  }
  addEventListener("resize", () => { if (!document.getElementById("v-pc").hidden) drawPCVine(); else placePhone(); });
  pc.addEventListener("click", (e) => {
    if (e.target.closest(".x")) { sel = null; renderPC(); return; }
    const t = e.target.closest("[data-toggle]"); if (t) { open[t.dataset.toggle] = !open[t.dataset.toggle]; renderPC(); return; }
    const r = e.target.closest("[data-node]"); if (r) { e.preventDefault(); sel = r.dataset.node; renderPC(); return; }
    const l = e.target.closest("[data-leaf]"); if (l) pc.querySelector("#pc-detail").innerHTML = leafHTML(leaves[l.dataset.leaf]);
  });

  /* ---------- phone ---------- */
  const ph = document.getElementById("phsc");
  let phB = "1";
  const ICONS = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>`;
  function renderPhone() {
    ph.innerHTML = `<div class="hd"><i></i>SECOND SUN${ICONS}</div><div class="ph"><h1>The Tree</h1>${goalHTML()}${scoreHTML()}${chipsHTML()}
      <div class="phtree" id="phtree"><svg class="vine" id="ph-vine" aria-hidden="true"></svg>
        ${["1", "2", "3", "4"].map((id, i) => `<button type="button" class="phcard box ${i % 2 ? "r" : "l"}" data-pb="${id}" aria-expanded="${id === phB}"><h3>${esc(nodes[id].title)}</h3><span class="tog" aria-hidden="true">${id === phB ? "&minus;" : "+"}</span><span class="st">${esc(WORD[nodes[id].status])}</span>${id === "2" ? `<p>${esc(SUB[id])}</p>` : ""}</button>`).join("")}</div>
      <div class="br box phrows" id="phrows"><div class="br-h" style="cursor:default"><span><h3>${esc(phB === "1" ? "Petrova" : nodes[phB].title)}</h3></span><span class="st" style="text-transform:none;letter-spacing:.04em">${phB === "1" ? "222 test planets" : esc(SUB[phB])}</span></div><ul class="rows">${nodes[phB].children.map((c) => rowHTML(c)).join("")}</ul></div></div>`;
    requestAnimationFrame(placePhone);
  }
  // cards alternate sides and overlap in height like the mockup; never on top of the card above on the same side
  function placePhone() {
    const box = ph.querySelector("#phtree"); if (!box) return;
    const cards = [...box.querySelectorAll(".phcard")];
    const bottomOf = { l: 0, r: 0 }; let prevTop = 0, maxB = 0; const pos = [];
    cards.forEach((c, i) => {
      const side = c.classList.contains("l") ? "l" : "r", h = c.offsetHeight;
      const top = Math.max(i ? prevTop + 58 : 14, bottomOf[side] ? bottomOf[side] + 14 : 0);
      c.style.top = top + "px"; bottomOf[side] = top + h; prevTop = top; maxB = Math.max(maxB, top + h); pos.push({ side, top });
    });
    const H = maxB + 90; box.style.height = H + "px";
    const svg = box.querySelector("#ph-vine"), w = box.clientWidth;
    svg.setAttribute("width", w); svg.setAttribute("height", H + 20);
    const targets = cards.map((c, i) => { const p = pos[i], y = p.top + 26; return { x: p.side === "l" ? c.offsetWidth : w - c.offsetWidth, y, join: y + 26 }; });
    drawVine(svg, { cx: w / 2, top: 0, bottom: maxB + 30, targets, k: .78, twigs: [] });
  }
  function phSheet(html) {
    const frame = ph.parentElement;
    frame.querySelectorAll(".scrim, .sheet").forEach((x) => x.remove());
    const s = document.createElement("div"); s.className = "scrim";
    const sh = document.createElement("div"); sh.className = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-modal", "true");
    sh.innerHTML = `<div class="grab" aria-hidden="true"></div>${html}`;
    const close = () => { s.remove(); sh.remove(); ph.style.overflowY = ""; };
    s.onclick = close; ph.style.overflowY = "hidden";
    sh.addEventListener("click", (e) => {
      if (e.target.closest(".x")) { close(); return; }
      const n = e.target.closest("[data-node]"); if (n) { e.preventDefault(); phSheet(detailHTML(n.dataset.node, true)); return; }
      const l = e.target.closest("[data-leaf]"); if (l) phSheet(leafHTML(leaves[l.dataset.leaf]));
    });
    frame.append(s, sh); sh.querySelector(".x").focus({ preventScroll: true });
  }
  ph.addEventListener("click", (e) => {
    const b = e.target.closest("[data-pb]"); if (b) { phB = b.dataset.pb; renderPhone(); requestAnimationFrame(() => requestAnimationFrame(() => { const r = ph.querySelector("#phrows"); if (r) ph.scrollTo({ top: r.offsetTop - 70, behavior: reduce ? "auto" : "smooth" }); })); return; }
    const r = e.target.closest("[data-node]"); if (r) { sel = r.dataset.node; phSheet(detailHTML(sel, true)); }
  });

  /* ---------- switch ---------- */
  const show = (v) => { document.querySelectorAll(".switch button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v))); document.getElementById("v-pc").hidden = v !== "pc"; document.getElementById("v-phone").hidden = v !== "phone"; if (v === "pc") renderPC(); else renderPhone(); };
  document.querySelectorAll(".switch button").forEach((b) => (b.onclick = () => show(b.dataset.v)));
  show("pc");
})();
</script>
