# Twinlight: the units and lessons (Claude, 15 Nov 2026; order from RS-035, data first).
# A lesson listed here with a file is live; one without a file shows as "coming". hooks.py builds docs/assets/data/learn.json from this on every build.
units:
  - n: 1
    title: A star's light on a graph
    lessons:
      - {file: u1/l1-a-light-curve.md, title: "A light curve", minutes: 12}
      - {file: u1/l2-percent-and-ppm.md, title: "Percent and parts per million", minutes: 12}
      - {file: u1/l3-noise.md, title: "Noise: the spread of the points", minutes: 14}
      - {file: u1/l4-what-a-dip-looks-like.md, title: "What a dip looks like", minutes: 15}
  - n: 2
    title: What makes a dip
    lessons:
      - {file: u2/l1-orbits-and-periods.md, title: "Orbits and periods", minutes: 15}
      - {file: u2/l2-how-long-a-dip-lasts.md, title: "How long a dip lasts", minutes: 14}
      - {title: "Why stars differ"}
      - {title: "Light from two stars at once"}
  - n: 3
    title: Two suns
    lessons:
      - {title: "Eclipsing binaries"}
      - {title: "How two stars orbit"}
      - {title: "Planets around two suns"}
      - {title: "Why they are rare and hard to find"}
  - n: 4
    title: The telescope and the data
    lessons:
      - {title: "How TESS watches the sky"}
      - {title: "From pixels to light curves"}
      - {title: "What goes wrong"}
  - n: 5
    title: Finding dips with a computer
    lessons:
      - {title: "Smoothing out slow changes"}
      - {title: "Searching with boxes"}
      - {title: "False alarms and the upside-down test"}
      - {title: "Hiding fake planets"}
  - n: 6
    title: Proving it
    lessons:
      - {title: "What a clean null means"}
      - {title: "Blind runs and rules written first"}
      - {title: "From a dip to a claim"}
  - n: 7
    title: Beyond the project
    lessons:
      - {title: "Gravity, light and stars"}
