  - {ch: 1, line: "19 Oct: we chose G1, 549 Kepler two-star systems, and matched Kepler's names to TESS's.", note: "2026-10-19"}
  - {ch: 2, line: "19 Oct: every search starts from a light curve, brightness against time, so this is the skill we use most."}
  - {ch: 3, line: "19 Oct: we measured how big TESS files are on your PC and where they come from.", note: "2026-10-19"}
  - {ch: 6, line: "20 Oct: the Bible Overhaul wrote down the orbit maths behind the wandering."}
  - {ch: 7, line: "19 to 20 Oct: the overnight run showed that noise alone makes fake dips."}
  - {ch: 8, line: "19 to 20 Oct: our detector re-found TOI-1338 b in 4 of 8 sectors, then we kept testing it.", note: "2026-10-20"}
  - {ch: 9, line: "20 Oct: hiding fake planets in real data showed us how small a planet we can see.", note: "2026-10-20"}
