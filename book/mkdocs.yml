site_name: Second Sun
site_description: A beginner's hunt for planets in public NASA TESS data.
# ASSUMPTION: repo name "second-sun" under M1Smacker. Change if the repo is named differently.
site_url: https://m1smacker.github.io/second-sun/
copyright: Book 3.2.0 · Text CC BY 4.0, code MIT. Work in progress, not announced.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon-64.png
  font: false            # system fonts: no Google request, works offline, fast on iPhone
  icon:
  palette:
    - scheme: slate      # first entry = default = dark "night observatory"
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Daylight reading}
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Back to night}
  features: [navigation.tabs, navigation.tabs.sticky, navigation.sections, navigation.indexes, navigation.path, navigation.top, search.highlight]

plugins: [search]
hooks: [hooks.py]
# mkdocs serve also rebuilds when these change (hooks.py writes only into site/, so no rebuild loop)
watch: [progress, data, overrides, sw-template.js]

extra_css: [assets/extra.css, assets/observatory.css, assets/shape.css, assets/book3.css]
extra_javascript: [assets/eyes-flow.js, assets/eyes-core.js, assets/eyes-strength.js, assets/eyes-hard.js, assets/eyes-feedback.js, assets/eyes-cloud.js, assets/rehearsal.js, assets/demos.js, assets/watch.js, assets/book3.js]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc: {permalink: true}
  - pymdownx.arithmatex: {generic: true, inline_syntax: [round], block_syntax: [square]}

extra:
  generator: false

not_in_nav: |
  /labs/*.md
  /learn/u*/*.md

nav:
  - Tree: index.md
  - Learning: learn/index.md
  - Shelf:
      - "The Shelf": shelf.md
      - "Diary":
          - field-notes/index.md
          - "14 Nov 2026": field-notes/2026-11-14.md
          - "11 Nov 2026": field-notes/2026-11-11.md
          - "10 Nov 2026": field-notes/2026-11-10.md
          - "4 Nov 2026": field-notes/2026-11-04.md
          - "3 Nov 2026": field-notes/2026-11-03.md
          - "2 Nov 2026": field-notes/2026-11-02.md
          - "31 Oct 2026": field-notes/2026-10-31.md
          - "30 Oct 2026": field-notes/2026-10-30.md
          - "29 Oct 2026": field-notes/2026-10-29.md
          - "28 Oct 2026": field-notes/2026-10-28.md
          - "27 Oct 2026": field-notes/2026-10-27.md
          - "24 Oct 2026": field-notes/2026-10-24.md
          - "23 Oct 2026": field-notes/2026-10-23.md
          - "21 Oct 2026": field-notes/2026-10-21.md
          - "20 Oct 2026": field-notes/2026-10-20.md
          - "19 Oct 2026": field-notes/2026-10-19.md
      - "Training deck":
          - training.md
          - "Eyes mode": eyes.md
          - "Rehearsal": rehearsal.md
      - "Search window": watch.md
      - Candidates: candidates.md
      - Glossary: glossary.md
      - "Facts (claims register)": claims.md
      - "For astronomers": reference/for-astronomers.md
      - "Prior work": reference/prior-work.md
      - "Reading list": reference/reading-list.md
      - Versions: versions.md
