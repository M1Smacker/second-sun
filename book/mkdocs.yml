site_name: Second Sun
site_description: A beginner's hunt for planets in public NASA TESS data.
# ASSUMPTION: repo name "second-sun" under M1Smacker. Change if the repo is named differently.
site_url: https://m1smacker.github.io/second-sun/
copyright: Text CC BY 4.0, code MIT. Work in progress, not announced.

theme:
  name: material
  custom_dir: overrides
  font: false            # system fonts: no Google request, works offline, fast on iPhone
  icon:
    logo: material/telescope
  palette:
    - scheme: slate      # first entry = default = dark "night observatory"
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Daylight reading}
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Back to night}
  features: [navigation.instant, navigation.tabs, navigation.sections, navigation.indexes, navigation.path, navigation.top, search.highlight]

plugins: [search]
hooks: [hooks.py]
# mkdocs serve also rebuilds when these change (hooks.py writes only into site/, so no rebuild loop)
watch: [progress, data, overrides, sw-template.js]

extra_css: [assets/extra.css, assets/observatory.css, assets/shape.css]
extra_javascript: [assets/eyes-core.js, assets/eyes-strength.js, assets/eyes-hard.js, assets/eyes-feedback.js, assets/eyes-cloud.js, assets/demos.js]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc: {permalink: true}

extra:
  generator: false

not_in_nav: |
  /index.md
  /labs/*.md
  /parts/*/review.md
  /parts/*/labs.md

nav:
  - Read:
      - "Start here": start/index.md
      - "The learning track": learn/index.md
      - "How to read this book": start/how-to-read.md
      - "The story so far": start/story-so-far.md
      - "The first real search": start/first-search.md
      - "How the project unfolded": start/journey.md
      - "Part 1 · The sky and the data":
          - parts/part1/index.md
          - "1. Stars, names and missions": book/01-stars-names-missions.md
          - "2. Light curves": book/02-light-curves.md
          - "3. Our data": book/03-our-data.md
      - "Part 2 · Two suns":
          - parts/part2/index.md
          - "4. Two suns": book/04-two-suns.md
          - "5. Wandering transits": book/05-wandering-transits.md
          - "6. Orbits and the three-body problem": book/06-orbits-three-body.md
      - "Part 3 · Finding dips":
          - parts/part3/index.md
          - "7. Noise and statistics": book/07-noise-and-statistics.md
          - "8. Our detector": book/08-our-detector.md
          - "9. Fake planets": book/09-fake-planets.md
      - "Part 4 · Is it real?":
          - parts/part4/index.md
          - "10. Vetting": book/10-vetting.md
          - "11. Pixels and neighbours": book/11-pixels-and-neighbours.md
      - "Part 5 · The professionals' tool":
          - parts/part5/index.md
          - "12. STANLEY": book/12-stanley.md
      - "Part 6 · How the project runs":
          - parts/part6/index.md
          - "13. Your workshop": book/13-your-workshop.md
          - "14. Credit and publishing": book/14-credit-and-publishing.md
          - "15. Our mistakes, as lessons": book/15-mistakes-as-lessons.md
  - Hunt:
      - Progress: progress.md
      - Quests: quests.md
      - Candidates: candidates.md
      - "Eyes mode": eyes.md
      - "Field notes":
          - field-notes/index.md
          - "19 Oct 2026": field-notes/2026-10-19.md
          - "20 Oct 2026": field-notes/2026-10-20.md
          - "21 Oct 2026": field-notes/2026-10-21.md
          - "23 Oct 2026": field-notes/2026-10-23.md
          - "24 Oct 2026": field-notes/2026-10-24.md
          - "27 Oct 2026": field-notes/2026-10-27.md
  - Reference:
      - "For astronomers": reference/for-astronomers.md
      - "Prior work": reference/prior-work.md
      - Glossary: glossary.md
      - "Facts (claims register)": claims.md
      - "Reading list": reference/reading-list.md
